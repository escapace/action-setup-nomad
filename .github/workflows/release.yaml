name: release
on:
  pull_request:
    branches:
      - trunk
    paths-ignore:
      - README.md
      - LICENSE

  push:
    branches:
      - trunk
    paths-ignore:
      - README.md
      - LICENSE
    tags:
      - 'v*'

jobs:
  test-latest:
    runs-on: ${{ matrix.os }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: setup
        uses: ./
        with:
          enterprise: ${{ matrix.enterprise }}
          nomad-version: ${{ matrix.version }}
      - name: check version
        run: nomad --version
    strategy:
      matrix:
        enterprise: [false, true]
        os: [ubuntu-latest, windows-latest, macos-latest]
        version:
          - ~1.11.0
          - latest

  release:
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - test-latest
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v6
      - name: github release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --generate-notes
